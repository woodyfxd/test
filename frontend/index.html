<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=64" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ZooHotel CRM" />
    <link rel="manifest" href="/manifest.json" />
    <title>ZooHotel CRM — Гостиница для животных</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for Mobile and Desktop background notifications
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('ZooHotel Service Worker registered:', reg.scope),
            (err) => console.warn('Service Worker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
